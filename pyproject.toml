[project]
name = "mcp-hotswap"
version = "0.1.0"
description = "Lazy-start wrapper for stdio MCP servers: serves discovery from cache, spawns the server on first use, stops it when idle."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vadim Zaliva" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/vzaliva/mcp-hotswap"

[project.scripts]
mcp-hotswap = "mcp_hotswap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
